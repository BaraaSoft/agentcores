name: Publish to npm

# Publishes `agentcores` to npm. `release.yml` calls it after release-please creates a release.
# Pushing a tag such as v0.1.0 by hand also runs it. Either way, the tag must match the version in
# packages/cli/package.json.
#
# npm trusts this repository through OIDC (trusted publishing), so there is no npm token. npm checks the
# name of the workflow that started the run: `release.yml` for a release, or `publish.yml` for a tag
# pushed by hand. Each name needs its own trusted publisher in the package settings on npmjs.com.
on:
  push:
    tags: ['v*']
  workflow_call:
    inputs:
      tag:
        description: The release tag to publish, for example v0.1.0
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish agentcores
    runs-on: macos-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Update npm, because trusted publishing needs npm 11.5.1 or newer
        run: npm install -g npm@latest
      - name: Check that the tag matches the package version
        run: |
          VERSION=$(node -p "require('./packages/cli/package.json').version")
          [ "v$VERSION" = "$TAG" ] || { echo "Tag $TAG does not match version $VERSION"; exit 1; }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:libs
      - run: pnpm --filter @agentcores/backend --filter @agentcores/web-ui build
      - run: pnpm --filter agentcores test
      - run: pnpm --filter agentcores publish --access public --no-git-checks
