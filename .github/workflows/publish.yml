name: Publish to npm

# Push a tag such as v0.1.0 to publish `agentcores` to npm. The tag must match the version in
# packages/cli/package.json. Needs the NPM_TOKEN secret: an npm automation token with publish rights.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish agentcores
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Check that the tag matches the package version
        run: |
          VERSION=$(node -p "require('./packages/cli/package.json').version")
          [ "v$VERSION" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME does not match version $VERSION"; exit 1; }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:libs
      - run: pnpm --filter @agentcores/backend --filter @agentcores/web-ui build
      - run: pnpm --filter agentcores test
      - run: pnpm --filter agentcores publish --access public --provenance --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
